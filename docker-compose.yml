version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hkeducan
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hkeducan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
